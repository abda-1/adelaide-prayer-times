name: Update Prayer Times

on:
  # Run daily at 2am Adelaide time (ACDT is UTC+10:30, so 2am = ~3:30pm UTC previous day)
  schedule:
    - cron: '30 15 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install node-fetch cheerio
      
      - name: Run scraper
        run: node scrape.js
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet mosques.json || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mosques.json
          git commit -m "chore: update prayer times [$(date +'%Y-%m-%d')]"
          git push

